name: E2E Smoke (Vercel Preview)

# F0.2 · Tests E2E smoke rutas críticas piloto
# Plan: .context/PLAN-recuperacion-post-incidente-2026-04-21.md F0.2
# Baseline documentado: .context/E2E-BASELINE-2026-04-23.md
# Target: Vercel Preview deployment (CEO guard: opción b)
#
# Trigger: Vercel-GitHub app emite `deployment_status` al repo cuando
# un Preview deployment termina con state=success. Este workflow escucha
# ese evento y corre las 3 specs piloto contra la preview URL.
#
# Trigger manual disponible via workflow_dispatch para pruebas ad-hoc.

on:
  # Trigger automático en push a main y PRs target main · habilitado 2026-05-08
  # como pre-requisito de Fase 3 branches recovery (auditoría 2026-05-09 detectó
  # 0 runs históricos automáticos del workflow).
  #
  # Nota B-CI-01 (abierto · re-evaluar cuando se agregue backend a CI):
  # los tests Playwright requieren backend real. En push/pull_request no hay
  # backend en runner GH Actions → modo lint+typecheck+build only.
  #
  # 2026-05-19 (PR #55 audit cierre · D-FIX-CI-SMOKE-DEPLOYMENT-STATUS):
  # Trigger `deployment_status` REMOVIDO porque el preview de Vercel del
  # proyecto `crece-v2` tiene Vercel SSO Password Protection (HTTP 401) que
  # bloquea Playwright. Cada PR desde 2026-05-08 falló este check generando
  # ruido tóxico (~10+ overrides). Re-activar cuando: (a) backend en CI vía
  # docker postgres + uvicorn ephemeral, o (b) Vercel SSO desactivado en el
  # proyecto crece-v2 con un mecanismo de bypass para Playwright.
  #
  # Para correr playwright manualmente contra un BASE_URL real:
  #   gh workflow run e2e-smoke.yml -f base_url=https://...
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "BASE_URL para Playwright (URL accesible con backend real, sin SSO wall)"
        required: false
        type: string

jobs:
  smoke:
    # Corre en:
    # - workflow_dispatch (manual con BASE_URL · invoca playwright real)
    # - push a main / pull_request a main (modo lint+typecheck+build, skip Playwright)
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Resolve BASE_URL
        id: base
        env:
          INPUT_BASE_URL: ${{ inputs.base_url }}
          DEPLOYMENT_TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          if [ -n "$INPUT_BASE_URL" ]; then
            echo "base_url=$INPUT_BASE_URL" >> "$GITHUB_OUTPUT"
            echo "source=manual_input" >> "$GITHUB_OUTPUT"
            echo "playwright_enabled=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$DEPLOYMENT_TARGET_URL" ]; then
            echo "base_url=$DEPLOYMENT_TARGET_URL" >> "$GITHUB_OUTPUT"
            echo "source=deployment_status" >> "$GITHUB_OUTPUT"
            echo "playwright_enabled=true" >> "$GITHUB_OUTPUT"
          else
            # push/pull_request sin BASE_URL · modo lint+build, skip Playwright
            echo "base_url=" >> "$GITHUB_OUTPUT"
            echo "source=lint_build_only" >> "$GITHUB_OUTPUT"
            echo "playwright_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::push/pull_request sin BASE_URL · ejecutando lint+build only (B-CI-01 abierto)"
          fi

      - name: Frontend lint (non-blocking · B-LINT-01)
        # `next lint` requiere setup interactivo (no hay .eslintrc · ningún
        # eslint dep en package.json). Marcado non-blocking hasta que B-LINT-01
        # configure ESLint propiamente. Bloquear el CI por lint impediría que
        # typecheck+build verifiquen cambios reales.
        continue-on-error: true
        run: npm run lint --if-present

      - name: Anti-mock-data guardrail (D-ANTI-MOCK-1)
        # Falla el CI si alguien re-introduce hardcoded fallback con métricas
        # numéricas visibles al usuario. Origen: incidente 2026-05-11
        # CompetitorSnapshotCard mostraba 8.8K mock vs 89.8K real.
        # Tres patrones: _FALLBACK con metrics, DEMO_/MOCK_/FAKE_ arrays,
        # comentarios TODO replace-with-API. Convención de excepción legítima:
        # marcar línea con /* allow-mock: razón */.
        run: npm run check:no-mocks

      - name: Frontend typecheck
        run: npx tsc --noEmit

      - name: Frontend build (smoke)
        run: npm run build --if-present
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8002

      - name: Install Playwright Chromium
        if: steps.base.outputs.playwright_enabled == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run piloto smoke specs
        if: steps.base.outputs.playwright_enabled == 'true'
        env:
          BASE_URL: ${{ steps.base.outputs.base_url }}
          CI: "true"
        run: |
          echo "Running against $BASE_URL (source: ${{ steps.base.outputs.source }})"
          # 3 specs cubren las 4 rutas piloto críticas:
          # - pages.spec.ts      → /login + /dashboard
          # - diagnostico.spec.ts → /dashboard/diagnostico/{id}
          # - diagnostico-tier2.spec.ts → /dashboard/diagnostico-tier2/{id}
          # Known failures esperadas post-3d6fe3f documentadas en
          # .context/E2E-BASELINE-2026-04-23.md:
          # - /dashboard/aceptacion (no cubierta, será verde post-F1.1)
          # - /dashboard/admin/overview (no cubierta, será verde post-F1.1)
          npx playwright test \
            pages.spec.ts \
            diagnostico.spec.ts \
            diagnostico-tier2.spec.ts

      - name: Upload Playwright report on failure
        if: failure() && steps.base.outputs.playwright_enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "## E2E Smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Event:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **BASE_URL:** ${{ steps.base.outputs.base_url || '(none · lint+build only)' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Source:** ${{ steps.base.outputs.source }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Playwright:** ${{ steps.base.outputs.playwright_enabled }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.base.outputs.playwright_enabled }}" = "true" ]; then
            echo "**Specs:** pages, diagnostico, diagnostico-tier2" >> "$GITHUB_STEP_SUMMARY"
            echo "Known failures esperadas post-F1.1: /aceptacion, /admin/overview" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Modo lint+build only** · B-CI-01 abierto (backend en CI pendiente)" >> "$GITHUB_STEP_SUMMARY"
          fi
