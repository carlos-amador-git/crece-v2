name: E2E Smoke (Vercel Preview)

# F0.2 · Tests E2E smoke rutas críticas piloto
# Plan: .context/PLAN-recuperacion-post-incidente-2026-04-21.md F0.2
# Baseline documentado: .context/E2E-BASELINE-2026-04-23.md
# Target: Vercel Preview deployment (CEO guard: opción b)
#
# Trigger: Vercel-GitHub app emite `deployment_status` al repo cuando
# un Preview deployment termina con state=success. Este workflow escucha
# ese evento y corre las 3 specs piloto contra la preview URL.
#
# Trigger manual disponible via workflow_dispatch para pruebas ad-hoc.

on:
  # deployment_status trigger deshabilitado temporalmente · 2026-04-24.
  # Razón: los tests Playwright hacen apiRequestContext.post("http://localhost:8002/...")
  # hardcoded para seed/setup · GitHub Actions runner no tiene backend Crece levantado
  # → ECONNREFUSED → tests always-red (ruido, no signal).
  # Re-habilitar cuando B-CI-01 setup backend-in-CI (postgres docker + seed + uvicorn
  # ephemeral) esté resuelto.
  workflow_dispatch:
    inputs:
      base_url:
        description: "BASE_URL para Playwright (URL preview Vercel o equivalente con backend accesible)"
        required: true
        type: string

jobs:
  smoke:
    # Corre solo en Preview deployments exitosos de Vercel · skip production para no tumbar el piloto
    # En workflow_dispatch manual, corre siempre
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve BASE_URL
        id: base
        run: |
          if [ -n "${{ inputs.base_url }}" ]; then
            echo "base_url=${{ inputs.base_url }}" >> "$GITHUB_OUTPUT"
            echo "source=manual_input" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.deployment_status.target_url }}" ]; then
            echo "base_url=${{ github.event.deployment_status.target_url }}" >> "$GITHUB_OUTPUT"
            echo "source=deployment_status" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No BASE_URL available from deployment_status or workflow_dispatch input"
            exit 1
          fi

      - name: Run piloto smoke specs
        env:
          BASE_URL: ${{ steps.base.outputs.base_url }}
          CI: "true"
        run: |
          echo "Running against $BASE_URL (source: ${{ steps.base.outputs.source }})"
          # 3 specs cubren las 4 rutas piloto críticas:
          # - pages.spec.ts      → /login + /dashboard
          # - diagnostico.spec.ts → /dashboard/diagnostico/{id}
          # - diagnostico-tier2.spec.ts → /dashboard/diagnostico-tier2/{id}
          # Known failures esperadas post-3d6fe3f documentadas en
          # .context/E2E-BASELINE-2026-04-23.md:
          # - /dashboard/aceptacion (no cubierta, será verde post-F1.1)
          # - /dashboard/admin/overview (no cubierta, será verde post-F1.1)
          npx playwright test \
            pages.spec.ts \
            diagnostico.spec.ts \
            diagnostico-tier2.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "## E2E Smoke · Vercel Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- **BASE_URL:** ${{ steps.base.outputs.base_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Source:** ${{ steps.base.outputs.source }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Specs:** pages, diagnostico, diagnostico-tier2" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Known failures esperadas post-F1.1: /aceptacion, /admin/overview" >> "$GITHUB_STEP_SUMMARY"
