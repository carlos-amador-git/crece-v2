[project]
name = "crece-v2"
version = "2.0.0"
description = "CRECE v2.0 — Political Intelligence Platform for Mexican Political Parties"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "boto3>=1.35.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "httpx>=0.28.0",
    "anthropic>=0.40.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "geoalchemy2>=0.15.0",
    "pgvector>=0.3.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",
    "shapely>=2.0.0",
    "ensta>=5.2.0",
    "moviepy<2",
    "Scweet>=5.2",
    "scrapetube>=2.6.0",
    "yt-dlp>=2026.3.0",
    "playwright>=1.40.0",
    "facebook-page-info-scraper>=1.1.0",
    "instaloader>=4.15.0",
    "twscrape>=0.13.0",
    "TikTokApi>=7.3.0",
    "google-api-python-client>=2.140.0",
    "sherlock-project>=0.15.0",
    "sentry-sdk>=2.0.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
nlp = [
    "pysentimiento>=0.7.0",
    "sentiment-analysis-spanish>=0.0.25",
    "spacy>=3.8.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
]
ml = [
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0",
    "anyio>=4.7.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "coverage>=7.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
