# S4.3 — Seed accounts CDMX por alcaldía
#
# 3 alcaldías piloto: Cuauhtémoc, Benito Juárez, Miguel Hidalgo.
# Cada alcaldía aporta ~50 cuentas semilla clasificadas por tipo:
#   - OFICIAL   (alcaldía oficial, concejales, áreas gob)
#   - MEDIO     (medios locales/hiperlocales con cobertura de la alcaldía)
#   - FUNCIONARIO (directores, coordinadores, voceros)
#   - POLITICO  (dirigentes políticos con base en esa alcaldía)
#   - INFLUENCER (cuentas locales con cobertura barrial)
#
# NOTA: Esta lista es la base del trends_detector. Las cuentas inactivas o
# bloqueadas se marcan con `active: false` y se excluyen de la cola de scrape.
#
# FUENTE: Compilado desde padrón IECM + sitios oficiales + directorios
# públicos. Handles son datos públicos; NO hay DM scraping ni login mining.

