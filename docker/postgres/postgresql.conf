# CRECE v2.0 — PostgreSQL logging hardening (D-DATA-02g)
#
# Problem: default log_statement = 'all' logs bind parameters that may
# contain PII (emails, clave_electoral, phone numbers) in plaintext
# before pgcrypto encryption is applied. This violates LFPDPPP
# data-minimisation principle.
#
# This file is mounted read-only into the container and included from
# the default postgresql.conf via the docker-compose volume mount.

# ── Logging ──────────────────────────────────────────────────────
# Do NOT log SQL statements (bind params may contain PII).
log_statement = 'none'

# Only log the SQL text when a statement causes an ERROR or worse.
log_min_error_statement = 'error'

# Log slow queries (> 5 seconds) for performance debugging.
# The risk of PII in slow-query logs is accepted because these are
# rare and the alternative (no slow-query visibility) is worse.
log_min_duration_statement = 5000

# Keep standard connection/disconnection logging for audit trail.
log_connections = on
log_disconnections = on

# Log duration of completed statements (without SQL text).
log_duration = off

# Log line prefix: timestamp + pid + user + db — no query text.
log_line_prefix = '%m [%p] %u@%d '
